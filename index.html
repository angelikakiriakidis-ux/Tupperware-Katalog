<style>
:root{--bg:#fff;--fg:#14213d;--mut:#5b6478;--line:#e1e5ec;--card:#f4f6f9;--acc:#0b4ea2;--on:#fff;--red:#c4262e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10131a;--fg:#eef1f6;--mut:#a0a8b8;--line:#2a3040;--card:#1a1f2b;--acc:#6aa5ff;--on:#10131a;--red:#ff6b72}}
:root[data-theme=dark]{--bg:#10131a;--fg:#eef1f6;--mut:#a0a8b8;--line:#2a3040;--card:#1a1f2b;--acc:#6aa5ff;--on:#10131a;--red:#ff6b72}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
.bar{background:#14213d;color:#fff;text-align:center;font-size:13px;padding:6px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header h1{font-size:22px;margin:0 auto 0 0;letter-spacing:.5px}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a,.btn{font:inherit;text-decoration:none;color:var(--fg);padding:8px 14px;border-radius:999px;border:1px solid transparent;background:none;cursor:pointer}
nav a.on{background:var(--fg);color:var(--bg)}nav a:hover{border-color:var(--line)}
.btn{background:var(--acc);color:var(--on);font-weight:600;border-color:var(--acc)}
.btn.sec{background:none;color:var(--fg);border-color:var(--line)}.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,nav a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
h2{font-size:26px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.ph{position:relative;background:#fff;aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:12px}
.ph img{max-width:100%;max-height:100%;object-fit:contain}.phb{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:100%;height:100%}.phb:focus-visible{outline:3px solid var(--acc);outline-offset:2px}.btn.blue,.btn.back{background:#0b4ea2;color:#fff;border-color:#0b4ea2}.btn.back{margin-bottom:14px}
.card .in{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:15px;margin:0;font-weight:600}.mut{color:var(--mut);font-size:14px}.price{font-size:18px;font-weight:700}
.card .btn{margin-top:auto}
.adm{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.adm .btn{padding:5px 10px;font-size:13px}
.panel{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px 16px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.flip{display:grid;grid-template-columns:1fr 1fr;min-height:440px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);position:relative}
.flip .l{background:#fff;display:flex;align-items:center;justify-content:center;padding:24px;position:relative}.flip .l img{max-width:100%;max-height:420px}
.flip .r{padding:36px;display:flex;flex-direction:column;gap:10px;justify-content:center}.flip h2{font-size:28px}
.cover{grid-column:1/-1;text-align:center;justify-content:center;align-items:center;display:flex;flex-direction:column;padding:60px 20px;gap:10px}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0}
.th{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.th button{flex:0 0 auto;width:64px;height:64px;border:2px solid var(--line);border-radius:8px;background:#fff;padding:3px;cursor:pointer}.th button.on{border-color:var(--acc)}.th img{width:100%;height:100%;object-fit:contain}
table{width:100%;border-collapse:collapse}td,th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}td img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:6px}td.p,th.p{text-align:right;white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.top h2{margin:0}.sum{text-align:right;font-size:20px;font-weight:700;margin:14px 0}
.mail{display:grid;gap:10px;margin-top:20px;background:var(--card);padding:16px;border-radius:10px}textarea{min-height:200px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.tools label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);flex:1 1 220px}.tools select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}.zs{max-width:700px}.zs p{margin:0 0 14px;font-size:18px}.pre{white-space:pre-line}.ship{text-align:right;font-size:14px;color:var(--mut);margin:-8px 0 14px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 220px}.note{font-size:13px;color:var(--mut)}
.fw{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}.arr{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:28px;line-height:1;cursor:pointer}.arr:disabled{opacity:.3;cursor:default}.arr:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(max-width:700px){.arr{width:34px;height:34px;font-size:22px}.flip{grid-template-columns:1fr}.flip .r{padding:20px}}
</style></head><body>

": "p124", "nr": 123, "name": "NEU - Tupperware „Semmel-Runde“ (2 Dosen +1 Dipp-Behälter)", "dim": "", "price": 15.0, "cat": "Aufbewahren", "file": "20260827_183340.jpg"}, {"id": "p125", "nr": 124, "name": "Gebraucht - Tupperware Ersatzteile", "dim": "je Teil", "price": 1.0, "cat": "Ersatzteile", "file": "20260902_184002.jpg"}, {"id": "p126", "nr": 125, "name": "Gebraucht - Tupperware Ersatzteile (Quick-Chef)", "dim": "je Teil", "price": 2.0, "cat": "Ersatzteile", "file": "20260902_183859.jpg"}], "email": "angelika.kiriakidis@googlemail.com", "wa": "4917634402110", "site": "https://angelikakiriakidis-ux.github.io/Tupperware-Katalog/"}</script>
<script>
const S=JSON.parse(document.getElementById("state").textContent);
const $=s=>document.querySelector(s),app=$("#app");
let view="uebersicht",pg=1,draft=null,ask=false,sent=false,cat="",q="";
let cart=[];try{cart=JSON.parse(localStorage.getItem("cart")||"[]")}catch(e){}
const saveCart=()=>{try{localStorage.setItem("cart",JSON.stringify(cart))}catch(e){}};
const eur=n=>n.toFixed(2).replace(".",",")+" €";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const find=id=>S.items.find(i=>i.id===id);
cart=cart.filter(find);
const PH="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#f4f6f9"/><text x="100" y="105" font-family="sans-serif" font-size="16" fill="#5b6478" text-anchor="middle">Bild folgt</text></svg>');
const src=i=>"bilder/"+encodeURIComponent(i.file);
const im=(i,alt)=>`<img src="${src(i)}" alt="${alt?esc(i.name):""}" loading="lazy" onerror="this.onerror=null;this.src='${PH}'">`;
const cats=[...new Set(S.items.map(i=>i.cat))];
/* Suche: tolerant (ein ähnliches Wort genügt) */
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g," ").replace(/ae/g,"a").replace(/oe/g,"o").replace(/ue/g,"u").trim();
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function wordHit(w,t){
  if(t.includes(w))return true;
  if(t.length>=4&&w.includes(t))return true;
  if(w.length>=4&&lev(w,t)<=(w.length>=8?2:1))return true;
  if(w.length>=5&&t.length>=5&&lev(w,t.slice(0,w.length))<=1)return true;
  return false;
}
function matches(i){
  if(cat&&i.cat!==cat)return false;
  const ws=norm(q).split(" ").filter(Boolean);if(!ws.length)return true;
  const toks=norm(i.name).split(" ").filter(Boolean);
  return ws.some(w=>toks.some(t=>wordHit(w,t)));
}
function toggleCart(id){sent=false;cart=cart.includes(id)?cart.filter(x=>x!==id):[...cart,id];saveCart();render()}
const cartBtn=i=>`<button class="btn ${cart.includes(i.id)?"sec":""}" data-cart="${i.id}">${cart.includes(i.id)?"Aus dem Warenkorb":"In den Warenkorb"}</button>`;
function card(i){
  return `<article class="card"><div class="ph"><button class="phb" data-go="${i.id}" aria-label="Katalogblatt: ${esc(i.name)}">${im(i,1)}</button></div>
  <div class="in"><h3>${esc(i.name)}</h3>${i.dim?`<div class="mut pre">${esc(i.dim)}</div>`:""}<div class="price">${eur(i.price)}</div>${cartBtn(i)}</div></article>`;
}
function gridHtml(){const L=S.items.filter(matches);return L.length?`<div class="grid">${L.map(card).join("")}</div>`:"<p>Keine passenden Artikel gefunden.</p>"}
function vUeb(){
  return `<h2>Übersicht</h2><div class="tools"><label>Kategorie<select id="cat"><option value="">Alle Kategorien</option>${cats.map(c=>`<option ${c===cat?"selected":""}>${esc(c)}</option>`).join("")}</select></label><label>Suche nach Produktname<input id="q" type="search" placeholder="z. B. Schüssel" value="${esc(q)}" autocomplete="off"></label></div><div id="gw">${gridHtml()}</div>`;
}
function vZustand(){
  return `<h2>Zustand</h2><div class="zs"><p><b>Neu =</b> Lagerbestand unbenutzt</p><p><b>Gebraucht - wie neu =</b> nur wenige Male benutzt, minimale Gebrauchsspuren</p><p><b>Gebraucht =</b> kann Gebrauchsspuren enthalten</p></div>`;
}
function vFlip(){
  const n=S.items.length;if(!n)return `<button class="btn back" data-back="1">‹ Zurück zur Übersicht</button><p>Noch keine Artikel vorhanden.</p>`;
  pg=Math.max(1,Math.min(pg,n));const i=S.items[pg-1];
  return `<button class="btn back" data-back="1">‹ Zurück zur Übersicht</button>
  <div class="fw"><button class="arr" id="pv" aria-label="Vorherige Seite" ${pg<=1?"disabled":""}>‹</button>
  <div class="flip"><div class="l">${im(i,1)}</div><div class="r"><h2>${esc(i.name)}</h2>${i.dim?`<div class="mut pre">Maße/Volumen: ${esc(i.dim)}</div>`:""}<div class="price" style="font-size:26px">${eur(i.price)}</div><div>${cartBtn(i)}</div></div></div>
  <button class="arr" id="nx" aria-label="Nächste Seite" ${pg>=n?"disabled":""}>›</button></div>
  <div class="ctl"><span>Seite ${pg} von ${n}</span></div>
  <div class="th">${S.items.map((x,k)=>`<button class="${pg===k+1?"on":""}" data-pg="${k+1}" aria-label="${esc(x.name)}">${im(x,0)}</button>`).join("")}</div>`;
}
function mailText(){const L=cart.map(find).filter(Boolean);return "Ich bin an folgenden Artikel interessiert:\n\n"+L.map(i=>`- ${i.name}${i.dim?` (${i.dim.replace(/\n/g," / ")})`:""} – ${eur(i.price)}`).join("\n")+`\n\nSumme: ${eur(L.reduce((a,i)=>a+i.price,0))}`+(S.site?`\n\nZum Katalog: ${S.site}`:"")}
function vCart(){
  const L=cart.map(find).filter(Boolean),sum=L.reduce((a,i)=>a+i.price,0);
  if(!L.length)return `<h2>Warenkorb</h2>${sent?"<p><b>Danke für deine Anfrage!</b></p>":""}<p>Der Warenkorb ist leer. Wähle Artikel in der <a href="#uebersicht">Übersicht</a> aus.</p>`;
  return `<div class="top"><h2>Warenkorb</h2><button class="btn sec" id="clr">Warenkorb löschen</button></div><table><tr><th></th><th>Artikel</th><th class="p">Preis</th><th></th></tr>${L.map(i=>`<tr><td>${im(i,0)}</td><td>${esc(i.name)}${i.dim?`<div class="mut pre">${esc(i.dim)}</div>`:""}</td><td class="p">${eur(i.price)}</td><td><button class="btn sec" data-cart="${i.id}">Entfernen</button></td></tr>`).join("")}</table>
  <div class="sum">Summe: ${eur(sum)}</div><div class="ship">Bei Versand zzgl. Versandkosten je nach Größe &amp; Gewicht 6-8€</div>${ask?`<div class="mail"><b>Anfrage bearbeiten und senden</b><textarea id="body">${esc(draft)}</textarea><div><button class="btn blue" id="upd">Aktualisieren</button> <span class="note">übernimmt Änderungen am Warenkorb in den Text (eigene Textänderungen werden dabei ersetzt)</span></div><div class="row"><button class="btn" id="smail">Per E-Mail senden</button><button class="btn blue" id="swa" ${S.wa?"":"disabled"}>Per WhatsApp senden</button></div><p class="note">Der Button öffnet dein E-Mail-Programm bzw. WhatsApp mit dem fertigen Text; dort schickst du die Nachricht ab.</p></div>`:`<div style="text-align:right"><button class="btn" id="ask">Anfrage senden</button></div>`}`;
}
function render(){
  $("#cnt").textContent=cart.length;
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===view));
  app.innerHTML=view==="blaettern"?vFlip():view==="warenkorb"?vCart():view==="zustand"?vZustand():vUeb();
}
function route(){view=(location.hash||"#uebersicht").slice(1);if(!["zustand","uebersicht","blaettern","warenkorb"].includes(view))view="uebersicht";render()}
addEventListener("hashchange",route);
addEventListener("keydown",e=>{if(view==="blaettern"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){if(e.key==="ArrowRight"){pg++;render()}if(e.key==="ArrowLeft"){pg--;render()}}});
app.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;$("#gw").innerHTML=gridHtml()}});
app.addEventListener("change",e=>{if(e.target.id==="cat"){cat=e.target.value;$("#gw").innerHTML=gridHtml()}});
app.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.go){pg=S.items.findIndex(x=>x.id===d.go)+1;location.hash="#blaettern";return}
  if(d.back){location.hash="#uebersicht";return}
  if(d.cart)return toggleCart(d.cart);
  if(d.pg!==undefined){pg=+d.pg;return render()}
  if(t.id==="pv"){pg--;return render()}if(t.id==="nx"){pg++;return render()}
  if(t.id==="clr"){cart=[];saveCart();ask=false;draft=null;return render()}
  if(t.id==="ask"){draft=mailText();ask=true;return render()}
  if(t.id==="upd"){draft=mailText();return render()}
  if(t.id==="smail"||t.id==="swa"){
    const b=$("#body").value;
    const u=t.id==="smail"?`mailto:${S.email}?subject=${encodeURIComponent("Anfrage Tupperware-Katalog")}&body=${encodeURIComponent(b)}`:`https://wa.me/${S.wa.replace(/\D/g,"")}?text=${encodeURIComponent(b)}`;
    window.open(u,"_blank");
    cart=[];saveCart();ask=false;draft=null;sent=true;render();
  }
});
route();
</script></body></html>
